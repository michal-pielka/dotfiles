# Include the theme
include=~/.config/foot/theme.ini

# Ask the compositor (Hyprland) to blur behind the transparent
# background. Needed since foot supports ext-background-effect-v1:
# without it, Hyprland doesn't blur foot windows at all.
[colors-dark]
blur=yes

[main]
font=JetBrainsMono Nerd Font:size=10.6
line-height=13
letter-spacing=0.20
pad=4x4
term=xterm-256color

[cursor]
style=block
blink=no

[scrollback]
lines=10000
multiplier=20.0

[mouse]
hide-when-typing=yes

[key-bindings]
scrollback-up-half-page=Control+u
scrollback-down-half-page=Control+d
vim-mode-start=Control+space

[vim-bindings]
# Same key to leave vim mode (default: Control+Shift+space i Control+c)
cancel=Control+space i Control+c
