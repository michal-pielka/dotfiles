# hyprlock — stacked clock, frosted blur, gruvbox
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

$fg     = rgb(ebdbb2)
$muted  = rgb(a89984)
$accent = rgb(d79921)
$red    = rgb(fb4934)
$font   = JetBrainsMono Nerd Font
$clock  = Press Start 2P

general {
    hide_cursor = true
    ignore_empty_input = true
}

auth {
    fingerprint:enabled = false
}

# Frosted background: heavy blur, darkened, a bit of grain
background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 10
    brightness = 0.45
    contrast = 0.9
    vibrancy = 0.15
    vibrancy_darkness = 0.1
    noise = 0.02
}

# Hours
label {
    monitor =
    text = cmd[update:1000] date +"%H"
    color = $fg
    font_size = 110
    font_family = $clock
    position = 0, 140
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(00000099)
}

# Minutes
label {
    monitor =
    text = cmd[update:1000] date +"%M"
    color = $muted
    font_size = 110
    font_family = $clock
    position = 0, -20
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(00000099)
}

# Password: dots only, no box; outline appears only on check/fail
input-field {
    monitor =
    size = 220, 40
    outline_thickness = 2
    rounding = 0
    outer_color = rgba(00000000)
    inner_color = rgba(00000000)
    font_color = $fg
    check_color = $accent
    fail_color = $red
    capslock_color = $accent
    dots_size = 0.22
    dots_spacing = 0.45
    dots_center = true
    fade_on_empty = false
    placeholder_text =
    fail_text = <span foreground="##fb4934">$FAIL</span>
    font_family = $font
    position = 0, -170
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000088)
}
